name: Build Dahua Downloader APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Dahua SDK files
        shell: bash
        run: |
          set -euo pipefail
          test -s app/libs/INetSDK.jar
          d=app/src/main/jniLibs/arm64-v8a
          test -d "$d"
          for f in libnetsdk.so libjninetsdk.so libconfigsdk.so libavnetsdk.so libcrypto.so libssl.so; do
            test -s "$d/$f" || { echo "Нет файла $f в $d"; exit 1; }
          done
          # защита от LFS-заглушек: настоящая libnetsdk.so — десятки мегабайт
          size=$(stat -c%s "$d/libnetsdk.so")
          echo "libnetsdk.so: $size bytes"
          test "$size" -gt 1000000
          echo "Native libraries: $(find "$d" -maxdepth 1 -type f -name '*.so' | wc -l)"

      - name: Set up Go for Dahua P2P bridge
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'

      - name: Build Android P2P bridge (Go)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          cd p2pbridge
          go get golang.org/x/mobile@latest
          go mod tidy
          gomobile bind -v -target=android/arm64 -androidapi 26 -javapkg=ru.dahuatools.p2p -o ../app/libs/dahua-p2p.aar .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "--- native libs inside APK"
          unzip -l "$APK" | grep -E ' lib/' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DahuaDownloader-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
